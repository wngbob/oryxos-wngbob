spring:
  application:
    name: oryxos
  # JDK 21 虚拟线程:同步阻塞执行模型下单机扛高并发(章程 VIII,不引入响应式)
  threads:
    virtual:
      enabled: true
  datasource:
    # .oryxos/ 工作区由 oryxos init 创建;busy_timeout 防 SQLITE_BUSY,WAL 提升并发读,外键强制开启
    url: jdbc:sqlite:.oryxos/oryxos.db?busy_timeout=5000&journal_mode=WAL&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者:连接池 = 1,防 SQLITE_BUSY
      maximum-pool-size: 1
  jpa:
    # 表结构演进不依赖 ddl-auto:建表走手工脚本 oryxos-storage/src/main/resources/db/schema.sql
    hibernate:
      ddl-auto: none
    # 纯 REST 服务(无视图渲染层),关闭 open-in-view 防懒加载泄漏到视图层,同时消除启动 WARN
    open-in-view: false
    properties:
      hibernate:
        # SQLite 无版本化 Dialect,显式指定避免启动期连接探测元数据
        dialect: org.hibernate.community.dialect.SQLiteDialect

server:
  port: 8080

# 可观测:Actuator + Prometheus 指标(四设计目标之「可观测」)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos

# OpenAPI 3.0:spec 在 /v3/api-docs,UI 暴露 /swagger-ui(与 contracts/rest-api.md 口径一致)
springdoc:
  swagger-ui:
    path: /swagger-ui

# Provider 全局层:本实例连不连得上某家厂商、凭证从哪个环境变量读(契约 contracts/provider-config.md §2)
# 与 Profile 层的分工:全局层管「连得上」,AGENT.md frontmatter 管「怎么用」;唯一耦合点是厂商名。
# api-key MUST 为 ${ENV_VAR} 占位、禁止明文(章程 VIII/FR-010);环境变量缺失时启动失败并指明变量名。
# 新增一家厂商:此处追加一项 + ProviderConfiguration 增加实现分支 + oryxos-provider/pom.xml 加模型依赖,Agent 侧零改动。
oryxos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY}
  # 搜索接缝的档位选择:配了 key 就用带 key 的 Tavily,留空则退回免 key 的 DuckDuckGo(装上就能跑)。
  # 与上面的 providers[].api-key 不同,这个占位**带空默认值**——搜索 key 是可选的,缺失不该让启动失败。
  # 同理 MUST 为 ${ENV_VAR} 占位、禁止明文(章程 VIII/FR-010)。
  search:
    tavily-api-key: ${TAVILY_API_KEY:}
  # 长期记忆后端档位(第 22 节,契约 contracts/memory-config.md §1)。
  # 三档递进:markdown(默认,零依赖、人可读、git 可跟踪)→ sqlite(量大后的结构化升级,仍零外部依赖)
  # → mem0(真要自动抽取/冲突消解/语义检索时的自托管外部集成档)。换档只改这一行,上层零改动。
  # 字面量而非环境变量占位:切档走改配置或 -Doryxos.memory.backend=sqlite(quickstart §3)。
  # 取值未知时装配处报错并列出合法取值,MUST NOT 静默退回默认档(FR-016)。
  memory:
    backend: markdown
    mem0:
      # 自托管 Mem0 的地址与用户作用域。两个占位**都带默认值**——markdown / sqlite 两档根本不读它们,
      # 缺失不该让启动失败;校验推迟到「真的选中 mem0 档」那一刻,且消息只带变量名、不带值(FR-018)。
      # 环境变量名不带 oryxos. 前缀:那是外部系统的既有命名(与上游一致)。
      base-url: ${MEM0_BASE_URL:}
      user-id: ${MEM0_USER_ID:oryxos}

# 沙箱白名单(第 24 节,契约 specs/007-sandbox-whitelist/contracts/sandbox-whitelist.md §3)。
# 键名逐字是 snake_case、不带 oryxos. 前缀——技术方案 §6.7 与课件原文即此形态。
# 两条口径,运维不读源码就该知道:
#   ① 留空 = 全拒,不是不校验。忘了配的后果是「什么都跑不了」(可见、可查),而不是「什么都放行」(静默、危险)。
#   ② 劝阻级防线:防的是模型犯傻与提示注入导致的越权,防不住蓄意绕过(命令拼接/软链接/编码绕过)。
#      核心阶段 MUST NOT 用它跑完全不可信的代码、MUST NOT 对外做多租户。
# 这份是「可用默认」不是「安全默认」:随包发出来只为开箱能跑通演示,生产部署 MUST 由运维按最小权限收紧。
file:
  # 留空 = 全拒(不是不校验);本块是劝阻级防线,防不住蓄意绕过。
  allowed_paths: ["."]              # 当前工作目录(启动时标准化为绝对路径)
shell:
  # 留空 = 全拒(不是不校验);本块是劝阻级防线,防不住蓄意绕过。条目是「可执行文件名」,写 /bin/ls 会永不匹配。
  allowed_commands: [ls, cat, head, tail, grep, find, wc, pwd, git]
http:
  # 留空 = 全拒(不是不校验);本块是劝阻级防线,防不住蓄意绕过。
  allowed_domains:
    - api.duckduckgo.com            # 免 key 搜索档的端点
    - api.tavily.com                # 带 key 搜索档的端点
    - open.feishu.cn                # 飞书群机器人
    - open.larksuite.com            # Lark(与飞书同一套协议)
    - qyapi.weixin.qq.com           # 企业微信群机器人
