spring:
  application:
    name: oryxos
  # JDK 21 虚拟线程:同步阻塞执行模型下单机扛高并发(章程 VIII,不引入响应式)
  threads:
    virtual:
      enabled: true
  datasource:
    # .oryxos/ 工作区由 oryxos init 创建;busy_timeout 防 SQLITE_BUSY,WAL 提升并发读,外键强制开启
    url: jdbc:sqlite:.oryxos/oryxos.db?busy_timeout=5000&journal_mode=WAL&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者:连接池 = 1,防 SQLITE_BUSY
      maximum-pool-size: 1
  jpa:
    # 表结构演进不依赖 ddl-auto:建表走手工脚本 oryxos-storage/src/main/resources/db/schema.sql
    hibernate:
      ddl-auto: none
    # 纯 REST 服务(无视图渲染层),关闭 open-in-view 防懒加载泄漏到视图层,同时消除启动 WARN
    open-in-view: false
    properties:
      hibernate:
        # SQLite 无版本化 Dialect,显式指定避免启动期连接探测元数据
        dialect: org.hibernate.community.dialect.SQLiteDialect

server:
  port: 8080

# 可观测:Actuator + Prometheus 指标(四设计目标之「可观测」)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos

# OpenAPI 3.0:spec 在 /v3/api-docs,UI 暴露 /swagger-ui(与 contracts/rest-api.md 口径一致)
springdoc:
  swagger-ui:
    path: /swagger-ui

# Provider 全局层:本实例连不连得上某家厂商、凭证从哪个环境变量读(契约 contracts/provider-config.md §2)
# 与 Profile 层的分工:全局层管「连得上」,AGENT.md frontmatter 管「怎么用」;唯一耦合点是厂商名。
# api-key MUST 为 ${ENV_VAR} 占位、禁止明文(章程 VIII/FR-010);环境变量缺失时启动失败并指明变量名。
# 新增一家厂商:此处追加一项 + ProviderConfiguration 增加实现分支 + oryxos-provider/pom.xml 加模型依赖,Agent 侧零改动。
oryxos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY}
