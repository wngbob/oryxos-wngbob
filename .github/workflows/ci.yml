name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'specs/**'
      - '**.md'
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvn verify 串起全部质量门禁:spotless:check → PMD(P3C)→ checkstyle →
      # spotbugs(findsecbugs)→ dependency-check(CVSS≥7 阻断),任一不过即红,禁止合并
      - name: mvn clean verify
        run: mvn -B clean verify -Dnvd.api.key=${NVD_API_KEY}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
